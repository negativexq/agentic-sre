name: checks

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install project
        run: make install
      - name: Run checks
        run: make check
      - name: Offline demo
        run: .venv/bin/agentic-sre demo --json > /dev/null

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build every image target
        run: make images
      - name: Smoke-test the control plane image
        run: docker run --rm agentic-sre/control-plane:dev agentic-sre demo

  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install kind
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          curl -fsSL -o ./kind.sha256sum https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64.sha256sum
          grep 'kind-linux-amd64$' ./kind.sha256sum | sha256sum --check --status -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install project
        run: make install
      - name: Run real Kubernetes release gate
        run: make e2e-kind
