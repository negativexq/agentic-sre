name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: make install
      - name: Run checks
        run: make check
      - name: Offline demo
        run: .venv/bin/agentic-sre demo --json > /dev/null

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build every image target
        run: make images
      - name: Smoke-test the control plane image
        run: docker run --rm agentic-sre/control-plane:dev agentic-sre demo

  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install project
        run: make install
      - name: Run real Kubernetes release gate
        run: make e2e-kind
