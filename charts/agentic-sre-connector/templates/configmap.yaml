apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "connector.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "connector.labels" . | nindent 4 }}
data:
  SRE_CONNECTOR_ENDPOINT: {{ .Values.controlPlane.endpoint | quote }}
  SRE_CONNECTOR_ENROLL_ENDPOINT: {{ .Values.controlPlane.enrollEndpoint | quote }}
  {{- with .Values.controlPlane.serverName }}
  SRE_CONNECTOR_SERVER_NAME: {{ . | quote }}
  {{- end }}
  SRE_CONNECTOR_TLS_CERT: /var/run/connector/tls/tls.crt
  SRE_CONNECTOR_TLS_KEY: /var/run/connector/tls/tls.key
  SRE_CONNECTOR_TLS_CA: /var/run/connector/tls/ca.crt
  SRE_CONNECTOR_CREDENTIAL_SECRET: {{ include "connector.credentials" . | quote }}
  SRE_CLUSTER_ACCESS: "true"
  SRE_WATCH_NAMESPACES: {{ .Values.watch.namespaces | join "," | quote }}
  SRE_EVIDENCE_NAMESPACES: {{ .Values.watch.evidenceNamespaces | join "," | quote }}
  SRE_WATCH_INTERVAL_SECONDS: {{ .Values.watch.intervalSeconds | quote }}
  SRE_ALERT_MIN_ACTIVE_SECONDS: {{ .Values.alerts.minActiveSeconds | quote }}
  SRE_ALERT_COVERAGE_POLL_SECONDS: {{ .Values.alerts.coveragePollSeconds | quote }}
  {{- with .Values.backends.alertmanager.url }}
  SRE_ALERTMANAGER_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backends.prometheus.url }}
  PROMETHEUS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backends.prometheus.tenant }}
  PROMETHEUS_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.backends.loki.url }}
  SRE_LOKI_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backends.tempo.url }}
  TEMPO_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backends.tempo.tenant }}
  TEMPO_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- if .Values.webhook.enabled }}
  SRE_CONNECTOR_WEBHOOK_LISTEN: "0.0.0.0:{{ .Values.webhook.port }}"
  {{- end }}
