apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.credentials" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "connector.labels" . | nindent 4 }}
  annotations:
    # the Connector's enrolled identity: written by the Connector itself, kept across upgrades and uninstalls
    helm.sh/resource-policy: keep
type: Opaque
{{- if not .Values.enrollment.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.enrollmentSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrollment.token | quote }}
{{- end }}
{{- if and .Values.webhook.enabled (not .Values.webhook.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.webhookSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "connector.labels" . | nindent 4 }}
type: Opaque
{{- /* keep the token across upgrades: the Alertmanager configuration carries it */}}
{{- $token := .Values.webhook.token }}
{{- if not $token }}
{{- with lookup "v1" "Secret" .Release.Namespace (include "connector.webhookSecret" .) }}
{{- $token = index .data "token" | b64dec }}
{{- end }}
{{- end }}
stringData:
  token: {{ $token | default (randAlphaNum 32) | quote }}
{{- end }}
{{- if or .Values.backends.alertmanager.token .Values.backends.prometheus.token .Values.backends.tempo.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.name" . }}-backends
  namespace: {{ .Release.Namespace }}
  labels: {{- include "connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  SRE_ALERTMANAGER_TOKEN: {{ .Values.backends.alertmanager.token | quote }}
  PROMETHEUS_BEARER_TOKEN: {{ .Values.backends.prometheus.token | quote }}
  TEMPO_BEARER_TOKEN: {{ .Values.backends.tempo.token | quote }}
{{- end }}
