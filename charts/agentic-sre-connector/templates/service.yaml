{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "connector.name" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels: {{- include "connector.labels" . | nindent 4 }}
spec:
  selector: {{- include "connector.selector" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.webhook.port }}
      targetPort: webhook
{{- end }}
