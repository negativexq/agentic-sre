# Chaos Mesh 2.8.4 for the Kind lab (docs/architecture/testbed-lab-design.md section 4).
#
# The chart defaults assume the Docker runtime (`runtime: docker`, /var/run/docker.sock); the lab's
# node runs containerd, whose socket is /run/containerd/containerd.sock. One controller replica, no
# dashboard and no DNS server (no scenario family uses DNS chaos).
chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
controllerManager:
  replicaCount: 1
dashboard:
  create: false
dnsServer:
  create: false
enableProfiling: false
