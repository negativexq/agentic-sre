apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: agentic-sre/control-plane:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: workload-config
          env:
            - name: SRE_BENCHMARK_ENVIRONMENT
              value: local-kind
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: sre-demo
spec:
  selector:
    app: control-plane
  ports:
    - port: 8000
      targetPort: 8000
