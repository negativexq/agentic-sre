apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sre-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: agentic-sre-reader
      containers:
        - name: control-plane
          image: agentic-sre/control-plane:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: workload-config
          env:
            - name: SRE_CLUSTER_ACCESS
              value: "true"
            - name: SRE_WATCH_NAMESPACES
              value: sre-demo
            - name: SRE_WATCH_INTERVAL_SECONDS
              value: "15"
            - name: SRE_AUTO_DIAGNOSE
              value: "true"
            - name: SRE_LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: sre-demo
spec:
  selector:
    app: control-plane
  ports:
    - port: 8000
      targetPort: 8000
