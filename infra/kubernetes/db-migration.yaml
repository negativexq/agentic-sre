apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: sre-demo
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          image: agentic-sre/migrator:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: workload-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
