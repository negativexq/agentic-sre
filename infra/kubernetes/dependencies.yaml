apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          env:
            - name: POSTGRES_DB
              value: agentic_sre
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          # An emptyDir outlives a container restart (the image's own directory does not), so a
          # restarted database keeps its data and its schema.
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "agentic_sre"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        # Brings the schema to head and keeps it there. `alembic upgrade head` is idempotent, so a
        # pod that was lost and came back empty converges again without a manual deploy step.
        - name: migrate
          image: agentic-sre/migrator:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until python -c "import socket; socket.create_connection(('localhost', 5432), 2)"; do sleep 2; done
              while true; do
                alembic upgrade head || true
                sleep 60
              done
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workload-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@localhost:5432/agentic_sre
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sre-demo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sre-demo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: controller,broker
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # An emptyDir outlives a container restart (the image default under /tmp does not),
            # so a restarted broker keeps its topics.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          ports:
            - containerPort: 9092
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
        # Declares the topics and re-creates any that are missing (after a pod loss, for
        # instance); creation is idempotent. Consumers such as order-worker fail hard on an
        # unknown topic, so this must not be a one-off deploy step.
        - name: topics
          image: apache/kafka:3.9.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 >/dev/null 2>&1; do sleep 2; done
              while true; do
                for topic in ${TOPICS//,/ }; do
                  /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic "$topic" --bootstrap-server localhost:9092 >/dev/null 2>&1 || true
                done
                sleep 30
              done
          env:
            - name: TOPICS
              value: orders.created
            - name: KAFKA_HEAP_OPTS
              value: -Xmx128m -Xms64m
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: kafka-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: sre-demo
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
