apiVersion: v1
kind: ServiceAccount
metadata:
  name: investigation-tools
  namespace: sre-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: investigation-tools-read-only
  namespace: sre-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: investigation-tools-read-only
  namespace: sre-demo
subjects:
  - kind: ServiceAccount
    name: investigation-tools
    namespace: sre-demo
roleRef:
  kind: Role
  name: investigation-tools-read-only
  apiGroup: rbac.authorization.k8s.io
