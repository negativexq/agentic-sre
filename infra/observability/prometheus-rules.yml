groups:
  - name: agentic-sre-baseline
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{service="payment-service",status=~"5.."}[30s])) > 0.05
        for: 2m
        labels:
          severity: critical
          namespace: sre-demo
        annotations:
          runbook: https://example.invalid/runbooks/high-error-rate
      - alert: HighRequestLatency
        expr: sum(rate(http_request_duration_seconds_sum{service="payment-service",route!~"/(health|metrics|__faults).*"}[30s])) / sum(rate(http_request_duration_seconds_count{service="payment-service",route!~"/(health|metrics|__faults).*"}[30s])) > 0.5
        for: 2m
        labels:
          severity: warning
          namespace: sre-demo
        annotations:
          runbook: https://example.invalid/runbooks/high-request-latency
      - alert: KafkaConsumerLag
        expr: clamp_min(sum(kafka_messages_total{service="order-service",topic="orders.created",direction="produced"}) - sum(kafka_messages_total{service="order-worker",topic="orders.created",direction="consumed"}), 0) > 10
        for: 2m
        labels:
          severity: critical
          namespace: sre-demo
        annotations:
          runbook: https://example.invalid/runbooks/kafka-consumer-lag
      - alert: PodRestartSpike
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
        for: 1m
        labels:
          severity: warning
          namespace: sre-demo
        annotations:
          runbook: https://example.invalid/runbooks/pod-restart-spike
      - alert: DBConnectionPressure
        expr: sum(rate(db_connection_acquisition_seconds_sum{service="payment-service"}[30s])) / sum(rate(db_connection_acquisition_seconds_count{service="payment-service"}[30s])) > 0.5
        for: 2m
        labels:
          severity: critical
          namespace: sre-demo
        annotations:
          runbook: https://example.invalid/runbooks/db-connection-pressure
      - alert: PaymentErrorRateHigh
        expr: sum(rate(http_requests_total{service="payment-service",status=~"5.."}[30s])) > 0.05
        for: 15s
        labels: {severity: critical, namespace: sre-demo, service: payment-service}
        annotations: {summary: Payment service error rate is high}
      - alert: OrderErrorRateHigh
        expr: sum(rate(http_requests_total{service="order-service",status=~"5.."}[30s])) > 0.05
        for: 15s
        labels: {severity: critical, namespace: sre-demo, service: order-service}
        annotations: {summary: Order service error rate is high}
      - alert: OrderDependencyLatencyHigh
        expr: sum(rate(dependency_request_duration_seconds_sum{service="order-service",dependency="payment-service"}[30s])) / sum(rate(dependency_request_duration_seconds_count{service="order-service",dependency="payment-service"}[30s])) > 0.5
        for: 15s
        labels: {severity: warning, namespace: sre-demo, service: order-service}
        annotations: {summary: Order payment dependency latency is high}
      - alert: OrderRequestLatencyHigh
        expr: (sum(rate(http_request_duration_seconds_sum{service="order-service",route="/orders"}[30s])) / sum(rate(http_request_duration_seconds_count{service="order-service",route="/orders"}[30s])) > 0.5) and on() (sum(rate(dependency_request_duration_seconds_sum{service="order-service",dependency="payment-service"}[30s])) / sum(rate(dependency_request_duration_seconds_count{service="order-service",dependency="payment-service"}[30s])) < 0.5)
        for: 15s
        labels: {severity: warning, namespace: sre-demo, service: order-service}
        annotations: {summary: Order request latency is high}
      - alert: PaymentDbAcquisitionSlow
        expr: sum(rate(db_connection_acquisition_seconds_sum{service="payment-service"}[30s])) / sum(rate(db_connection_acquisition_seconds_count{service="payment-service"}[30s])) > 0.5
        for: 15s
        labels: {severity: critical, namespace: sre-demo, service: payment-service}
        annotations: {summary: Payment database connection acquisition is slow}
      - alert: OrderDbQueryLatencyHigh
        expr: sum(rate(db_query_duration_seconds_sum{service="order-service",operation="create"}[30s])) / sum(rate(db_query_duration_seconds_count{service="order-service",operation="create"}[30s])) > 0.5
        for: 15s
        labels: {severity: warning, namespace: sre-demo, service: order-service}
        annotations: {summary: Order database query latency is high}
      - alert: OrderWorkerLagHigh
        expr: clamp_min(sum(kafka_messages_total{service="order-service",topic="orders.created",direction="produced"}) - sum(kafka_messages_total{service="order-worker",topic="orders.created",direction="consumed"}), 0) > 10
        for: 15s
        labels: {severity: critical, namespace: sre-demo, service: order-worker}
        annotations: {summary: Order worker consumer lag is high}
      - alert: OrderWorkerConsumerErrorsHigh
        expr: sum(rate(kafka_consumer_errors_total{service="order-worker"}[30s])) > 0
        for: 15s
        labels: {severity: critical, namespace: sre-demo, service: order-worker}
        annotations: {summary: Order worker consumer processing errors are high}
      - alert: PaymentServiceUnavailable
        expr: min(up{job="payment-service"}) < 1
        for: 15s
        labels: {severity: critical, namespace: sre-demo, service: payment-service}
        annotations: {summary: Payment service is unavailable}
      - alert: PaymentRequestLatencyHigh
        expr: sum(rate(http_request_duration_seconds_sum{service="payment-service",route!~"/(health|metrics|__faults).*"}[30s])) / sum(rate(http_request_duration_seconds_count{service="payment-service",route!~"/(health|metrics|__faults).*"}[30s])) > 0.5
        for: 15s
        labels: {severity: warning, namespace: sre-demo, service: payment-service}
        annotations: {summary: Payment request latency is high}
      - alert: PaymentRequestLatencyCritical
        expr: sum(rate(http_request_duration_seconds_sum{service="payment-service",route="/payments"}[30s])) / sum(rate(http_request_duration_seconds_count{service="payment-service",route="/payments"}[30s])) > 3
        for: 15s
        labels: {severity: critical, namespace: sre-demo, service: payment-service}
        annotations: {summary: Payment request latency is critically high}
