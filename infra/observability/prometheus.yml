global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager.observability.svc.cluster.local:9093]
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector.observability.svc.cluster.local:8889]
  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: [payment-service.sre-demo.svc.cluster.local:8000]
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: [order-service.sre-demo.svc.cluster.local:8000]
