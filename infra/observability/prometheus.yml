global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager.observability.svc.cluster.local:9093]
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector.observability.svc.cluster.local:8889]
