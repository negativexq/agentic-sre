[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-sre"
version = "0.3.0"
description = "Change-first root-cause analysis agent for Kubernetes incidents, with reproducible benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agentic SRE contributors" }]
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=6.4,<7.0",
    "confluent-kafka>=2.11,<3.0",
    "kubernetes>=32.0,<33.0",
    "opentelemetry-api>=1.37,<2.0",
    "opentelemetry-exporter-otlp>=1.37,<2.0",
    "opentelemetry-sdk>=1.37,<2.0",
    "openai>=1.0,<3.0",
    "prometheus-client>=0.22,<1.0",
    "PyYAML>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
agentic-sre = "apps.cli.main:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3.0",
    "mypy>=1.17,<2.0",
    "pre-commit>=4.3,<5.0",
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.13,<1.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps", "packages"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
